<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OverXP</title>
<style>
  :root {
    --bg: #0D0D0D;
    --gold: #D4A24C;
    --terra: #C8553D;
    --ivory: #F5F1E8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--bg); }

  /* ================= LOADER ================= */
  #loader {
    position: fixed; inset: 0; z-index: 9999;
    display: grid; place-items: center;
    background: radial-gradient(circle at 50% 50%, #161412 0%, var(--bg) 60%);
    clip-path: circle(150% at 50% 50%);
  }
  .loader-inner {
    display: flex; flex-direction: column; align-items: center; gap: 28px;
  }
  #mark {
    width: min(300px, 62vw); height: auto; overflow: visible;
    visibility: hidden;                     /* évite le flash avant GSAP */
  }
  #mark path { will-change: transform, opacity; }

  .ring-track    { fill: none; stroke: rgba(245, 241, 232, .07); stroke-width: 6; }
  .ring-progress { fill: none; stroke: url(#ringGrad); stroke-width: 6; stroke-linecap: round; }

  .counter {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 11px; font-weight: 500; letter-spacing: .4em;
    color: var(--ivory); opacity: 0;
    font-variant-numeric: tabular-nums;
    padding-left: .4em;                     /* compense le letter-spacing */
  }

  /* ================= SITE (remplace par ton contenu) ================= */
  main {
    min-height: 100vh; display: grid; place-items: center;
    color: var(--ivory); font: 800 clamp(28px, 6vw, 64px) system-ui, sans-serif;
  }
</style>
</head>

<main>Bienvenue</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(() => {
  const ORIGIN = '1076 862';               // centre du diaphragme (coordonnées SVG)
  const ring   = document.querySelector('.ring-progress');
  const LEN    = 2 * Math.PI * 580;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  gsap.set(ring, { strokeDasharray: LEN, strokeDashoffset: LEN });
  gsap.set('#mark', { visibility: 'visible' });

  /* ---------- 1. INTRO : ouverture de l'obturateur ---------- */
  let introResolve;
  const introDone = new Promise(r => (introResolve = r));

  const intro = gsap.timeline({ defaults: { ease: 'expo.out' }, onComplete: () => introResolve() });

  intro
    // Les lames apparaissent une à une dans le sens horaire, en tournant depuis le centre
    .from('#aperture path', {
      autoAlpha: 0, scale: 0.2, rotation: -70, svgOrigin: ORIGIN,
      duration: 1.2,
      // ordre horaire autour du cercle (data-o = angle normalisé 0→1)
      stagger: (i, el) => parseFloat(el.dataset.o) * 1.1
    })
    // Rotation d'ensemble : l'obturateur se "visse" en place
    .from('#aperture', { rotation: -90, svgOrigin: ORIGIN, duration: 2, ease: 'power4.out' }, 0)

    // Objectif central : mise au point (flou → net simulé par scale + opacity)
    .from('#lens path', {
      autoAlpha: 0, scale: 1.6, svgOrigin: ORIGIN,
      duration: 0.9, stagger: 0.04, ease: 'power3.out'
    }, 0.7)

    // Pixels : ils s'échappent du diaphragme vers le haut-droite, avec un léger rebond
    .from('#pixels path', {
      autoAlpha: 0, scale: 0, x: -140, y: 140, transformOrigin: '50% 50%',
      duration: 0.7, ease: 'back.out(2)',
      // du pixel le plus proche du cercle au plus éloigné
      stagger: (i, el) => (parseFloat(el.dataset.o) - 500) / 300 * 0.45
    }, 1.1)

    // Compteur
    .to('.counter', { opacity: .6, duration: 0.6, ease: 'power2.out' }, 1.2);

  /* Boucles d'attente (pendant le chargement) */
  const idle = gsap.timeline({ paused: true, repeat: -1 });
  idle
    .to('#aperture', { rotation: '+=360', svgOrigin: ORIGIN, duration: 24, ease: 'none' }, 0)
    .to('#pixels path', {
      opacity: 0.55, duration: 0.6, ease: 'sine.inOut',
      stagger: { each: 0.25, repeat: 1, yoyo: true }
    }, 0);
  intro.eventCallback('onComplete', () => { introResolve(); if (!reduce) idle.play(); });

  if (reduce) intro.progress(1);

  /* ---------- 2. CHARGEMENT RÉEL ---------- */
  // Mets ici les assets lourds à précharger (ex. frames de l'appareil photo)
  const assets = [
    // ...Array.from({ length: 120 }, (_, i) => `/frames/f_${String(i + 1).padStart(4, '0')}.webp`)
  ];

  // Lissage : la valeur affichée rattrape la vraie progression à chaque frame
  const state = { p: 0, target: 0 };
  const countEl = document.getElementById('count');
  const setProgress = (v) => { state.target = Math.max(state.target, v); };
  const render = () => {
    state.p += (state.target - state.p) * 0.08;
    if (state.target - state.p < 0.05) state.p = state.target;
    countEl.textContent = String(Math.round(state.p)).padStart(2, '0');
    ring.style.strokeDashoffset = LEN * (1 - state.p / 100);
  };
  gsap.ticker.add(render);
  const progressDone = () => new Promise(res => {
    const check = () => state.p >= 100 ? (gsap.ticker.remove(check), res()) : null;
    gsap.ticker.add(check);
  });

  const preload = (list) => {
    if (!list.length) {                    // démo : progression simulée
      return new Promise(res => gsap.to({}, {
        duration: 3.2, ease: 'none',
        onUpdate() { setProgress(this.progress() * 100); }, onComplete: res
      }));
    }
    let done = 0;
    return Promise.all(list.map(src => new Promise(res => {
      const img = new Image();
      img.onload = img.onerror = () => { setProgress(++done / list.length * 100); res(); };
      img.src = src;
    })));
  };

  /* ---------- 3. SORTIE : fermeture de l'obturateur ---------- */
  Promise.all([preload(assets), introDone])
    .then(() => { setProgress(100); return progressDone(); })
    .then(() => {
    gsap.ticker.remove(render);
    idle.pause();

    gsap.timeline({ delay: 0.35, onComplete: () => document.getElementById('loader').remove() })
      .to('.counter', { opacity: 0, duration: 0.3 })
      .to('.ring-track, .ring-progress', { autoAlpha: 0, scale: 1.08, svgOrigin: ORIGIN, duration: 0.5, ease: 'power2.in' }, '<')
      .to('#pixels path', {
        autoAlpha: 0, scale: 0, x: -140, y: 140, transformOrigin: '50% 50%',
        duration: 0.4, stagger: { each: 0.04, from: 'end' }, ease: 'power2.in'
      }, '<')
      .to('#lens', { scale: 0, svgOrigin: ORIGIN, duration: 0.45, ease: 'power3.in' }, '<0.1')
      .to('#aperture', { rotation: '+=120', scale: 0, svgOrigin: ORIGIN, duration: 0.8, ease: 'expo.in' }, '<0.05')
      .to('#loader', { clipPath: 'circle(0% at 50% 50%)', duration: 0.9, ease: 'expo.inOut' }, '-=0.35')
      .from('main', { opacity: 0, scale: 0.98, duration: 1, ease: 'power3.out' }, '-=0.45');
  });
})();
</script>
